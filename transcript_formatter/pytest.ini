[pytest]
# Run all tests: spec_engine/tests/ + root test_file_loader.py
# Exclude transcript_formatter_NEW (duplicate folder causes import conflicts)
testpaths = . spec_engine
norecursedirs = .git __pycache__ *.egg transcript_formatter_NEW depo_formatter_backup_* output temp logs
python_files = test_*.py
python_functions = test_*
addopts = -v
