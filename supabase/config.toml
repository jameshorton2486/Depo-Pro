[functions.transcribe-callback]
verify_jwt = false

# Scheduled sweep (pg_cron/pg_net or external cron). Not called by end-user JWTs;
# it authenticates the caller's bearer secret itself (WATCHDOG_SECRET or the
# service-role key), so JWT verification is disabled.
[functions.transcribe-watchdog]
verify_jwt = false


[functions.export-adapter]
verify_jwt = true

[functions.export-adapter-relay]
verify_jwt = false
