[project]
name = "auto-capture-tool"
version = "1.0.0"
description = "Automated full-page screenshot capture tool for web pages"
requires-python = ">=3.11"
dependencies = [
    "selenium==4.27.1",
    "webdriver-manager==4.0.2",
    "Pillow==11.0.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
