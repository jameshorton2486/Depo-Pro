name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Preflight Diagnostics
        run: |
          echo "=== Build Environment Diagnostics ==="
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo ""
          echo "=== Package Resolution ==="
          NEXT_VERSION=$(node -p "require('./package.json').dependencies?.next || require('./package.json').devDependencies?.next")
          echo "Declared Next.js: $NEXT_VERSION"
          if [ -f package-lock.json ]; then
            LOCKFILE_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
            echo "Lockfile hash: ${LOCKFILE_HASH:0:16}..."
          else
            echo "⚠️  package-lock.json not found"
          fi
          echo ""
          echo "=== Build Configuration ==="
          BUILD_CMD=$(node -p "require('./package.json').scripts.build")
          echo "Build command: $BUILD_CMD"
          echo ""
          echo "=== Diagnostics Complete ==="

      - name: Install dependencies
        run: npm ci

      - name: Verify Next.js version (enforcement)
        run: npm run check:version

      - name: Secret scan
        run: npm run security:scan

      - name: Lint (must be clean)
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder-for-ci-build
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder-service-role-key-for-ci-build
          NEXT_PUBLIC_SITE_URL: https://app.depo-pro.com
        run: npm run build
