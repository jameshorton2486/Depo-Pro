name: Version Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  enforce-next-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight Diagnostics
        run: |
          echo "=== Version Guard Diagnostics ==="
          echo "Node version: $(node --version)"
          NEXT_VERSION=$(node -p "require('./package.json').dependencies?.next || require('./package.json').devDependencies?.next")
          echo "Declared Next.js: $NEXT_VERSION"
          if [ -f package-lock.json ]; then
            LOCKFILE_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
            echo "Lockfile hash: ${LOCKFILE_HASH:0:16}..."
          fi
          echo ""

      - name: Install dependencies
        run: npm ci

      - name: Check Next.js version (enforcement)
        run: npm run check:version
