name: Version Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  enforce-next-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Next.js version
        run: |
          NEXT_VERSION=$(node -p "require('./package.json').dependencies?.next || require('./package.json').devDependencies?.next")

          echo "Detected Next.js version: $NEXT_VERSION"

          # Remove version prefix for comparison
          CLEAN_VERSION=$(echo "$NEXT_VERSION" | sed 's/[\^~]//g')

          # Block unstable versions
          if [[ "$NEXT_VERSION" == *"canary"* || "$NEXT_VERSION" == *"latest"* || "$NEXT_VERSION" == *"beta"* ]]; then
            echo "❌ Unstable Next.js version detected. Depo-Pro must use stable version 15.0.3"
            exit 1
          fi

          # Must be exactly 15.0.3
          if [ "$CLEAN_VERSION" != "15.0.3" ]; then
            echo "❌ Next.js version mismatch. Depo-Pro must use Next.js 15.0.3 exactly"
            echo "   Detected: $NEXT_VERSION"
            echo "   Required: 15.0.3"
            exit 1
          fi

          echo "✅ Next.js version OK (15.0.3): $NEXT_VERSION"
